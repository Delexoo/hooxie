<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Blue bloom wallpaper">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12306e"/>
      <stop offset="0.48" stop-color="#0a1d4d"/>
      <stop offset="1" stop-color="#050d28"/>
    </linearGradient>
    <radialGradient id="core" cx="46%" cy="42%" r="32%">
      <stop offset="0" stop-color="#f7fcff"/>
      <stop offset="0.16" stop-color="#d7f1ff"/>
      <stop offset="0.38" stop-color="#6eb6ff" stop-opacity="0.9"/>
      <stop offset="0.68" stop-color="#1d5ed8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d5ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="58%" cy="58%" r="55%">
      <stop offset="0" stop-color="#2a6adf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a6adf" stop-opacity="0"/>
    </radialGradient>
    <filter id="petal" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#night)"/>
  <rect width="1920" height="1080" fill="url(#haze)"/>
  <g filter="url(#petal)" transform="translate(820 430)">
    <ellipse rx="340" ry="78" fill="#8ec8ff" transform="rotate(-16)"/>
    <ellipse rx="310" ry="70" fill="#d4efff" transform="rotate(18)"/>
    <ellipse rx="280" ry="62" fill="#4d93f0" transform="rotate(58)"/>
    <ellipse rx="360" ry="84" fill="#6aafff" transform="rotate(102)"/>
    <ellipse rx="250" ry="56" fill="#eaf7ff" transform="rotate(148)"/>
    <ellipse rx="300" ry="68" fill="#2f6fe0" transform="rotate(196)"/>
    <ellipse rx="220" ry="50" fill="#b7dcff" transform="rotate(242)"/>
  </g>
  <circle cx="820" cy="430" r="280" fill="url(#core)" filter="url(#glow)"/>
</svg>
