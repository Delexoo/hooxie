<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact support · Hooxie</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body data-page="contact">
  <header class="top">
    <a class="brand" href="/home">Hooxie</a>
    <nav><a href="/help">Help</a><a href="/home#download">Download</a><a href="/dashboard">Dashboard</a></nav>
  </header>
  <main class="wrap">
    <article class="doc">
      <h1>Contact support</h1>
      <p>Write to <a href="mailto:support@delexo.store">support@delexo.store</a>. For a billing question, include the email on your Stripe receipt.</p>
      <form id="contact-form">
        <div class="field">
          <input name="name" type="text" placeholder="Name" aria-label="Name" required>
          <input name="email" type="email" placeholder="Email" aria-label="Email" required>
        </div>
        <textarea name="message" placeholder="How can we help?" aria-label="Message" required></textarea>
        <p><button class="btn" type="submit">Email support</button></p>
      </form>
    </article>
  </main>
  <footer class="foot">
    <span>© 2026 Delexo · Hooxie</span>
    <nav><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refund">Refunds</a></nav>
  </footer>
  <script src="/site.js"></script>
</body>
</html>
