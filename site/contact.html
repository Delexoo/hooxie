<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Hooxie</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Hooxie</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="menu-bars" aria-hidden="true"></span>
      <span class="sr">Menu</span>
    </button>
    <nav class="menu-screen" id="site-menu" aria-label="Pages">
      <a href="/#download">Download</a>
      <a href="/#features">Features</a>
      <a href="/#faq">FAQ</a>
      <a href="/help">Help</a>
      <a href="/ides">IDEs</a>
      <a href="/dashboard">Dashboard</a>
    </nav>
  </header>
  <main>
    <h1>Contact</h1>
    <p>Write to <a href="mailto:support@delexo.store">support@delexo.store</a>. For a billing question, include the email on your Stripe receipt.</p>
    <form id="contact-form">
      <input name="name" type="text" placeholder="Name" aria-label="Name" required>
      <input name="email" type="email" placeholder="Email" aria-label="Email" required>
      <textarea name="message" placeholder="How can we help?" aria-label="Message" required></textarea>
      <button type="submit">Email support</button>
    </form>
  </main>
  <footer>
    <p>
      <a href="/help">Help</a>
      <a href="/contact">Contact</a>
      <a href="/releases">Releases</a>
      <a href="/ides">IDEs</a>
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
      <a href="/refund">Refunds</a>
      <a href="/license">License</a>
    </p>
    <p>A Delexo product. Credit @delexo if you show or remix it.</p>
  </footer>
  <script>
    document.querySelector("#contact-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const name = String(data.get("name") || "").trim();
      const email = String(data.get("email") || "").trim();
      const message = String(data.get("message") || "").trim();
      const subject = encodeURIComponent(name ? `Hooxie support from ${name}` : "Hooxie support");
      const body = encodeURIComponent(`${message}\n\n${email}`);
      location.href = `mailto:support@delexo.store?subject=${subject}&body=${body}`;
    });
  </script>
  <script src="/menu.js"></script>
</body>
</html>
