name: Post release notes

on:
  push:
    branches: [main]
    paths:
      - brain/log.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site matches the log
        run: |
          node scripts/render-release-notes.mjs
          git diff --exit-code -- site/releases.html site/releases.json
      - name: Post notes that are not on GitHub yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-release-notes.mjs
